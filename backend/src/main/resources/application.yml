server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  application:
    name: sqa2-nacams
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/sqa2_nacams?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:sqa2}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
app:
  storage: ${APP_STORAGE:./runtime}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  token-hours: 12
  bootstrap:
    username: ${BOOTSTRAP_USERNAME:admin}
    password: ${BOOTSTRAP_PASSWORD:}
  backup:
    cron: ${BACKUP_CRON:0 0 2 * * *}
  library:
    scan-cron: ${LIBRARY_SCAN_CRON:0 30 1 * * *}
    holidays: ${LIBRARY_HOLIDAYS:}
  validation:
    name-min-length: ${NAME_MIN_LENGTH:2}
    name-max-length: ${NAME_MAX_LENGTH:15}
  site:
    name: 网络攻防对抗技术研究所
    english-name: ${SITE_ENGLISH_NAME:}
    logo: ${SITE_LOGO:}
    copyright: ${SITE_COPYRIGHT:}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
